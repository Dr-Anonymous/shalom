var lang = "te-IN",
	ver = "te",
	secondVer = "niv",
	downloadingVer = false,
	prefs = {},
	allBooks = ALL_BOOKS,
	B = 1,
	C = 1,
	firstTime = true,
	playing = false,
	histo = [],
	fromHistory = false,
	currentP = null,
	database,
	firebaseConfig = {
		apiKey: "AIzaSyBpFCW5CcLoQP3ThnTm2gtOJoxLPAnas-A",
		authDomain: "mydatabase-c35da.firebaseapp.com",
		databaseURL: "https://mydatabase-c35da-default-rtdb.firebaseio.com/",
		projectId: "mydatabase-c35da",
		storageBucket: "mydatabase-c35da.appspot.com",
		messagingSenderId: "945373860956",
		appId: "1:945373860956:web:3ea16749c73345eb684299"
	};

$(document).ready(async function() {
	// Embedded mode check
	var urlParams = new URLSearchParams(window.location.search);
	if (urlParams.has('parent')) {
		$('.header-container, footer').addClass('d-none');
		$('body').addClass('embedded-parent');
	}

	// Initialize Firebase Realtime Database
	try {
		firebase.initializeApp(firebaseConfig);
		database = firebase.database().ref();
		database.on('value', (snapshot) => {
			var data = snapshot.val();
			if (data) {
				prefs = (data["prefs"] && typeof data["prefs"] === 'object') ? data["prefs"] : {};
			}
		});
	} catch (e) {
		console.warn("Firebase init warning:", e);
	}

	// Populate Version Dropdowns
	populateVersionDropdowns();

	// Populate Book Quick Picker
	buildQuickPickerUI();

	// Load initial chapter (Genesis 1)
	getVerse(1, 1);
});

/* --------------------------------------------------------------------------
   Version Dropdown Management
   -------------------------------------------------------------------------- */
function populateVersionDropdowns() {
	$("#primaryVerDropdown").empty();
	$("#secondaryVerDropdown").empty();

	// Primary versions
	BIBLE_VERSIONS.forEach(v => {
		const isSelected = (normalizeVersion(ver) === v.id);
		const li = `
			<li class="d-flex align-items-center justify-content-between px-2 py-1">
				<a class="dropdown-item ${isSelected ? 'active fw-bold' : ''}" href="javascript:;" onclick="changePrimaryVersion('${v.id}')">
					${v.name}
				</a>
				<button type="button" class="btn btn-sm btn-link text-muted p-0 ms-2" onclick="handleOfflineDownload('${v.id}'); event.stopPropagation();" title="Download for offline use">
					<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
						<path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
						<path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/>
					</svg>
				</button>
			</li>`;
		$("#primaryVerDropdown").append(li);
	});

	// Secondary versions (including "None / Single View")
	const noneActive = (secondVer === 'none');
	$("#secondaryVerDropdown").append(`
		<li>
			<a class="dropdown-item ${noneActive ? 'active fw-bold' : ''}" href="javascript:;" onclick="changeSecondaryVersion('none')">
				None (Single Column View)
			</a>
		</li>
		<li><hr class="dropdown-divider"></li>
	`);

	BIBLE_VERSIONS.forEach(v => {
		const isSelected = (normalizeVersion(secondVer) === v.id);
		const li = `
			<li class="d-flex align-items-center justify-content-between px-2 py-1">
				<a class="dropdown-item ${isSelected ? 'active fw-bold' : ''}" href="javascript:;" onclick="changeSecondaryVersion('${v.id}')">
					${v.name}
				</a>
				<button type="button" class="btn btn-sm btn-link text-muted p-0 ms-2" onclick="handleOfflineDownload('${v.id}'); event.stopPropagation();" title="Download for offline use">
					<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
						<path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
						<path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/>
					</svg>
				</button>
			</li>`;
		$("#secondaryVerDropdown").append(li);
	});
}

function changePrimaryVersion(newVer) {
	ver = normalizeVersion(newVer);
	const vInfo = getVersionInfo(ver);
	lang = vInfo.lang;
	$("#lblPrimaryVer").text(vInfo.short || vInfo.name);
	$("#col1Title").text(vInfo.name);
	populateVersionDropdowns();
	getVerse(B, C);
}

function changeSecondaryVersion(newVer) {
	secondVer = (newVer === 'none') ? 'none' : normalizeVersion(newVer);
	if (secondVer === 'none') {
		$("#lblSecondaryVer").text("Off");
		$("#colSecondary").addClass("d-none");
		$("#colPrimary").removeClass("col-md-6").addClass("col-12");
	} else {
		const vInfo = getVersionInfo(secondVer);
		$("#lblSecondaryVer").text(vInfo.short || vInfo.name);
		$("#col2Title").text(vInfo.name);
		$("#colSecondary").removeClass("d-none");
		$("#colPrimary").removeClass("col-12").addClass("col-md-6");
	}
	populateVersionDropdowns();
	getVerse(B, C);
}

// Backward compatibility alias for changeVersion
function changeVersion(v) {
	changePrimaryVersion(v);
}

/* --------------------------------------------------------------------------
   Quick Book & Chapter Picker
   -------------------------------------------------------------------------- */
function openQuickPicker() {
	backToBooksView();
	$('#pickerSearch').val('');
	filterPickerBooks();
	const modal = new bootstrap.Modal(document.getElementById('pickerModal'));
	modal.show();
}

function buildQuickPickerUI() {
	const otContainer = document.getElementById('otBookGrid');
	const ntContainer = document.getElementById('ntBookGrid');
	otContainer.innerHTML = '';
	ntContainer.innerHTML = '';

	for (let i = 1; i <= 66; i++) {
		const book = allBooks[i];
		const btn = document.createElement('button');
		btn.type = 'button';
		btn.className = 'book-card-btn';
		btn.setAttribute('data-book-id', book[0]);
		btn.setAttribute('data-english', book[3].toLowerCase());
		btn.setAttribute('data-telugu', book[1].toLowerCase());
		btn.onclick = () => showChapterPicker(book[0]);

		btn.innerHTML = `
			<span>${book[1]}</span>
			<span class="book-secondary-name">${book[3]} (${book[2]})</span>
		`;

		if (i <= 39) {
			otContainer.appendChild(btn);
		} else {
			ntContainer.appendChild(btn);
		}
	}
}

function filterPickerBooks() {

function backToBooksView() {

}

/* --------------------------------------------------------------------------
   Core Scripture Retrieval Engine (Static JSON + In-Memory Caching)
   -------------------------------------------------------------------------- */
async function getVerse(b, c) {
	b = parseInt(b) || 1;
	c = parseInt(c) || 1;

	// Bounds checks
	if (b < 1) b = 1;
	if (b > 66) b = 66;
	if (c < 1) c = 1;
	if (c > allBooks[b][2]) {
		toast(allBooks[b][1] + " has only " + allBooks[b][2] + " chapters.");
		c = allBooks[b][2];
	}

	B = b;
	C = c;

	// Update HUD & Input Fields
	const bookName = (lang === "te-IN") ? allBooks[b][1] : allBooks[b][3];
	$("#book").val(bookName).attr("value", b);
	$("#chapter").val(c);
	$("#hudChapterTitle").text(`${allBooks[b][1]} (${allBooks[b][3]}) ${c}`);
	$("#col1BookBadge").text(`${b}:${c}`);
	$("#col2BookBadge").text(`${b}:${c}`);

	// History tracking
	if (!fromHistory) {
		histo.push([b, c]);
	} else {
		fromHistory = false;
	}

	// Audio button enable
	if (firstTime) {
		firstTime = false;
		$("#speak").removeClass("d-none");
		$("#history").removeClass("d-none");
	}

	// Parallel Fetching
	try {
		const primaryPromise = getBibleBook(ver, b);
		const secondaryPromise = (secondVer !== 'none') ? getBibleBook(secondVer, b) : Promise.resolve(null);

		const [primaryBook, secondaryBook] = await Promise.all([primaryPromise, secondaryPromise]);

		renderChapters(primaryBook, secondaryBook, c);
		navig(0);
	} catch (err) {
		console.error("Error loading chapter:", err);
		toast("Error loading chapter: " + err.message);
	}
}

function renderChapters(primaryBook, secondaryBook, chapterNum) {
	const cStr = String(chapterNum);
	const primaryVerses = (primaryBook && primaryBook.chapters && primaryBook.chapters[cStr]) ? primaryBook.chapters[cStr] : [];
	const secondaryVerses = (secondaryBook && secondaryBook.chapters && secondaryBook.chapters[cStr]) ? secondaryBook.chapters[cStr] : [];

	// Render Primary
	const bibleDiv = $("#bible");
	bibleDiv.empty();

	primaryVerses.forEach(vArr => {
		const vNum = vArr[0];
		const vText = vArr[1];
		const isCombined = vText.startsWith("[");
		const p = document.createElement("p");
		p.className = `verse-item ${ver === 'te' ? 'telugu-text' : 'english-text'}`;
		p.setAttribute("data-verse", vNum);

		if (isCombined) {
			p.innerHTML = `${vText} <span class="live-indicator-tag">LIVE</span>`;
		} else {
			p.innerHTML = `<span class="verse-badge">${vNum}</span><span class="verse-text">${vText}</span><span class="live-indicator-tag">LIVE</span>`;
		}
		bibleDiv.append(p);
	});

	// Render Secondary
	const bible2Div = $("#bible2");
	bible2Div.empty();

	if (secondVer !== 'none') {
		secondaryVerses.forEach(vArr => {
			const vNum = vArr[0];
			const vText = vArr[1];
			const isCombined = vText.startsWith("[");
			const p = document.createElement("p");
			p.className = `verse-item ${secondVer === 'te' ? 'telugu-text' : 'english-text'}`;
			p.setAttribute("data-verse", vNum);

			if (isCombined) {
				p.innerHTML = `${vText} <span class="live-indicator-tag">LIVE</span>`;
			} else {
				p.innerHTML = `<span class="verse-badge">${vNum}</span><span class="verse-text">${vText}</span><span class="live-indicator-tag">LIVE</span>`;
			}
			bible2Div.append(p);
		});
	}

	// Attach click handlers
	enableClick();
}

/* --------------------------------------------------------------------------
   Verse Click, Projection, & Firebase Broadcast
   -------------------------------------------------------------------------- */
function enableClick() {
	function handleVerseClick(event, element) {
		currentP = $(element);
		const vNum = currentP.attr("data-verse");

		// Synchronized highlight on both columns
		if (!event.ctrlKey && !event.metaKey) {
			$(".verse-item").removeClass("active-verse");
		}
		$(`.verse-item[data-verse='${vNum}']`).addClass("active-verse");

		// Build verse projection text
		const isSecondCol = currentP.closest('#bible2').length > 0;
		const activeBookName = isSecondCol ? allBooks[B][3] : ((lang === "te-IN") ? allBooks[B][1] : allBooks[B][3]);
		const cleanVerseText = currentP.find('.verse-text').text() || currentP.text();
		const formattedLine = `${activeBookName} ${C}:${vNum}\n${cleanVerseText}`;

		if (event.ctrlKey || event.metaKey) {
			const currentVal = $('#display').val();
			$('#display').val(currentVal ? currentVal + '\n\n' + formattedLine : formattedLine);
		} else {
			$('#display').val(formattedLine);
		}

		// Update UI live status badge
		$("#liveIndicator").removeClass("idle").text("LIVE ON SCREEN");

		// Broadcast to Firebase Realtime Database for projector/livestream
		writeFirebaseData('loadData', [' ', $('#display').val()]);
	}

	$('#bible .verse-item').off('click').on('click', function(e) {
		handleVerseClick(e, this);
	});

	$('#bible2 .verse-item').off('click').on('click', function(e) {
		handleVerseClick(e, this);
	});
}

function clearText() {
	$('#display').val('');
	$('.verse-item').removeClass('active-verse');
	$('#liveIndicator').addClass('idle').text('IDLE');
	writeFirebaseData('loadData', [' ', ' ']);
}

function broadcastLive() {
	writeFirebaseData('loadData', [' ', $('#display').val()]);
	$("#liveIndicator").removeClass("idle").text("LIVE ON SCREEN");
	toast("Broadcasted verse to live screen.");
}

function copyDisplayText() {
	const text = $('#display').val();
	if (!text) return;
	navigator.clipboard.writeText(text).then(() => {
		toast("Copied verse to clipboard!");
	});
}

/* --------------------------------------------------------------------------
   Chapter Navigation Controls
   -------------------------------------------------------------------------- */
function navig(i) {
	let b = B;
	let c = C;

	if (i === -1) {
		c = c - 1;
	} else if (i === 1) {
		c = c + 1;
	} else {
		// Update disabled button states
		$("#prev").removeClass("d-none");
		$("#next").removeClass("d-none");

		if (b === 1 && c === 1) {
			$("#prev").addClass("d-none");
		} else if (b === 66 && c === 22) {
			$("#next").addClass("d-none");
		}
		return;
	}

	if (b === 1 && c === 1) {
		$("#prev").addClass("d-none");
	} else if (b === 66 && c === 22) {
		$("#next").addClass("d-none");
	} else if (b > 1 && c === 0) {
		b -= 1;
		c = allBooks[b][2];
	} else if (c > allBooks[b][2]) {
		c = 1;
		b += 1;
	}

	getVerse(b, c);
}

/* --------------------------------------------------------------------------
   History
   -------------------------------------------------------------------------- */
function history() {
	$("#historyOptions").empty();
	let options = '';
	for (let i = histo.length - 1; i >= 0; i--) {
		const hB = histo[i][0];
		const hC = histo[i][1];
		const name = (lang === "te-IN") ? allBooks[hB][1] : allBooks[hB][3];
		options += `<li><a class="dropdown-item" href="javascript:;" onclick="fromHistory=true;getVerse(${hB}, ${hC});">${name} ${hC}</a></li>`;
	}
	if (!options) options = '<li><span class="dropdown-item text-muted">No history yet</span></li>';
	$("#historyOptions").append(options);
}

/* --------------------------------------------------------------------------
   Offline Download Handler
   -------------------------------------------------------------------------- */
async function handleOfflineDownload(versionId) {
	const norm = normalizeVersion(versionId);
	const vInfo = getVersionInfo(norm);

	toast(`Starting download for ${vInfo.name}...`);

	try {
		await downloadVersionOffline(norm, (done, total, pct) => {
			$('#toastBody').html(`
				<div class="mb-1"><strong>Downloading ${vInfo.name}</strong></div>
				<div class="progress" style="height: 12px;">
					<div class="progress-bar progress-bar-striped progress-bar-animated" style="width: ${pct}%">${pct}%</div>
				</div>
				<small class="text-muted">${done} of ${total} books cached</small>
			`);
			var toastBox = new bootstrap.Toast($('#myToast'), { delay: 5000 });
			toastBox.show();
		});

		toast(`✓ ${vInfo.name} is now available offline!`);
	} catch (err) {
		console.error("Offline download failed:", err);
		toast("Offline download failed: " + err.message);
	}
}

/* --------------------------------------------------------------------------
   Audio Readout (TTS)
   -------------------------------------------------------------------------- */
function toVoice(data) {
	if (!data) return;
	if (data.charAt(0) === "[") {
		data = data.slice(data.indexOf("]") + 2).replace(/౹/, "");
	} else {
		const match = data.match(/\d+/);
		if (match) data = data.replace(match[0] + ". ", "");
		data = data.replace(/౹/, "");
	}

	const url = "https://script.google.com/macros/s/AKfycbyPfdMprSx3UJhWSxuHxgknaIU-fc-ZW7LWebScdX-eDS157PraP1z3cerxzD8_Zf7qmg/exec?callback=readOut&lang=" + lang + "&data=" + encodeURIComponent(data);
	$.ajax({
		crossDomain: true,
		url: url,
		method: "GET",
		dataType: "jsonp"
	});
}

function readOut(e) {
	try {
		const binary = convertDataURIToBinary(e);
		const blob = new Blob([binary], { type: "audio/mpeg" });
		const blobUrl = URL.createObjectURL(blob);
		$("#source").attr("src", blobUrl);
		$("#audio")[0].pause();
		$("#audio")[0].load();
		$("#audio")[0].oncanplaythrough = function() {
			$("#audio")[0].play().catch(() => {});
		};
	} catch (err) {
		console.warn("Audio decode failed:", err);
	}
}

function convertDataURIToBinary(dataURI) {
	const raw = window.atob(dataURI);
	const rawLength = raw.length;
	const array = new Uint8Array(new ArrayBuffer(rawLength));
	for (let i = 0; i < rawLength; i++) {
		array[i] = raw.charCodeAt(i);
	}
	return array;
}

		$("#book").attr("value", value);
		$("#chapter").focus();
	},
});

const myData = [];
for (let i = 1; i < allBooks.length; i++) {
	myData.push({ label: allBooks[i][3], value: allBooks[i][0] });
	myData.push({ label: allBooks[i][1], value: allBooks[i][0] });
}

$("#chapter").keypress(function(event) {
	if (event.which === 13) {
		const b = parseInt($("#book").attr("value")) || B;
		const c = parseInt($("#chapter").val()) || 1;
		getVerse(b, c);
		this.blur();
	}
});

$("#verse").keypress(function(event) {
	if (event.which === 13) {
		const v = parseInt($("#verse").val()) || 1;
		this.blur();
		const vElement = $(`#bible .verse-item[data-verse='${v}']`);
		if (vElement.length > 0) {
			vElement.trigger('click');
			$("html, body").animate({
				scrollTop: vElement.offset().top - 200
			}, 400);
		}
	}
});

$('input').click(function(){
	if ($(':focus').attr('id') === 'book') $('#book').val('');
	if ($(':focus').attr('id') === 'chapter') $('#chapter').val('');
});

/* --------------------------------------------------------------------------
   Keyboard Shortcuts
   -------------------------------------------------------------------------- */
document.onkeydown = function(e) {
	e = e || window.event;
	if (e.keyCode === 27) { // ESC key
		clearText();
	} else if ((e.keyCode === 70 && e.ctrlKey) || (e.keyCode === 70 && e.metaKey)) { // Ctrl/Cmd + F
		writeFirebaseData('loadData', [' ', $('#display').val()]);
		toast("Broadcasted verse to screen.");
		e.preventDefault();
	}
};

/* --------------------------------------------------------------------------
   Firebase Realtime Database Writer
   -------------------------------------------------------------------------- */
function writeFirebaseData(name, value) {
	if (database) {
		database.update({
			"functionName": name,
			"value": value
		});
	}
}

function toast(tex) {
	$('#toastBody').html(tex);
	const toastBox = new bootstrap.Toast($('#myToast'));
	toastBox.show();
}

window.onbeforeunload = function() {
	writeFirebaseData(false, 0);
};
